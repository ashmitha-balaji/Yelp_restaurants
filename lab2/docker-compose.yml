# Run from repo: docker compose -f lab2/docker-compose.yml up --build
# Context directory must be lab-1 (parent of lab2).
name: yelp-lab2

services:
  # MySQL kept for: migration script and optional Lab-1 ai_assistant feature.
  # Core Lab-2 services no longer depend on MySQL.
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: yelp_db
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 12

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  user-service:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.service
      args:
        APP_MODULE: lab2.services.user_service.app:app
        APP_PORT: "8001"
    ports:
      - "8001:8001"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    environment:
      APP_ROOT: /app
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: yelp_lab2
      # For lab2/migrations/mysql_to_mongo.py via docker exec — host must be mysql, not localhost
      MYSQL_URL: mysql+pymysql://root:rootpass@mysql:3306/yelp_db
      SECRET_KEY: lab2-docker-secret-change-me
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      YELP_API_KEY: ${YELP_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

  owner-service:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.service
      args:
        APP_MODULE: lab2.services.owner_service.app:app
        APP_PORT: "8002"
    environment:
      APP_ROOT: /app
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: yelp_lab2
      SECRET_KEY: lab2-docker-secret-change-me
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy

  restaurant-service:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.service
      args:
        APP_MODULE: lab2.services.restaurant_service.app:app
        APP_PORT: "8003"
    environment:
      APP_ROOT: /app
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: yelp_lab2
      SECRET_KEY: lab2-docker-secret-change-me
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      YELP_API_KEY: ${YELP_API_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy
      user-service:
        condition: service_healthy

  review-service:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.service
      args:
        APP_MODULE: lab2.services.review_service.app:app
        APP_PORT: "8004"
    environment:
      APP_ROOT: /app
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: yelp_lab2
      SECRET_KEY: lab2-docker-secret-change-me
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_healthy

  review-worker:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.worker
    environment:
      APP_ROOT: /app
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DB_NAME: yelp_lab2
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_started
      user-service:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    volumes:
      - ./docker/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - owner-service
      - restaurant-service
      - review-service

  frontend:
    build:
      context: ..
      dockerfile: lab2/docker/Dockerfile.frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - gateway
