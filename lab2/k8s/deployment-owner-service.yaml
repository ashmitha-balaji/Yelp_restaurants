apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner-service
  namespace: yelp-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: owner-service
  template:
    metadata:
      labels:
        app: owner-service
    spec:
      containers:
        - name: owner-service
          image: yelp-owner-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: yelp-lab2-env
          env:
            - name: APP_MODULE
              value: "lab2.services.owner_service.app:app"
            - name: APP_PORT
              value: "8002"
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: owner-service
  namespace: yelp-lab2
spec:
  selector:
    app: owner-service
  ports:
    - port: 8002
      targetPort: 8002
