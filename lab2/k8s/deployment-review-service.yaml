apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: yelp-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-service
  template:
    metadata:
      labels:
        app: review-service
    spec:
      containers:
        - name: review-service
          image: yelp-review-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: yelp-lab2-env
          env:
            - name: APP_MODULE
              value: "lab2.services.review_service.app:app"
            - name: APP_PORT
              value: "8004"
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: yelp-lab2
spec:
  selector:
    app: review-service
  ports:
    - port: 8004
      targetPort: 8004
