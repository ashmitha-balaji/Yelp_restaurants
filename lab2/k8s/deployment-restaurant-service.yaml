apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: yelp-lab2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
    spec:
      containers:
        - name: restaurant-service
          image: 839408459700.dkr.ecr.us-west-2.amazonaws.com/yelp-lab2:restaurant-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8003
          envFrom:
            - configMapRef:
                name: yelp-lab2-env
          env:
            - name: APP_MODULE
              value: "lab2.services.restaurant_service.app:app"
            - name: APP_PORT
              value: "8003"
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: yelp-lab2
spec:
  selector:
    app: restaurant-service
  ports:
    - port: 8003
      targetPort: 8003
