apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-gateway-conf
  namespace: yelp-lab2
data:
  default.conf: |
    server {
        listen 8000;
        client_max_body_size 20m;

        location /auth {
            proxy_pass http://user-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /users {
            proxy_pass http://user-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /favorites {
            proxy_pass http://user-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /history {
            proxy_pass http://user-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /uploads {
            proxy_pass http://user-service:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
        location /owner-dashboard {
            proxy_pass http://owner-service:8002;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /restaurants {
            proxy_pass http://restaurant-service:8003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /ai-assistant {
            proxy_pass http://restaurant-service:8003;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
        location /reviews {
            proxy_pass http://review-service:8004;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: yelp-lab2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: nginx-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: yelp-lab2
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
